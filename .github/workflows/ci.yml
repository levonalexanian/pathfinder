name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y cmake ninja-build python3-pip python3-colcon-common-extensions \
            ros-jazzy-octomap-msgs ros-jazzy-octomap-ros python3-numpy python3-pytest \
            python3-attr python3-pil python3-psutil
          pip install "conan>=2,<3" --break-system-packages
          pip install "pyarrow==21.0.0" "typing-extensions>=4.5" --break-system-packages
          pip install --no-deps "rerun-sdk==0.40.0" --break-system-packages
      - name: Conan profile
        run: conan profile detect --force
      - name: Conan install
        run: conan install . --output-folder=build --build=missing -s build_type=Release
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          TOOLCHAIN="$(pwd)/build/conan_toolchain.cmake"
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN"
        shell: bash
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --return-code-on-test-failure
        shell: bash

  bench-and-ml:
    # CPU-only check of the ROS-free benchmark harness and the Python tooling.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config liboctomap-dev
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"
          pip install "numpy>=1.26,<3" "pytest>=8,<9"
      - name: Python tests
        run: PYTHONPATH=learning python -m pytest -q learning/tests
      - name: Build benchmark harness
        run: cmake -S bench -B bench/build -G Ninja && cmake --build bench/build
      - name: Benchmark smoke test
        run: |
          ./bench/build/pf_export_bt maps/demo_world.bt bench/build/demo_world.pfmap
          PYTHONPATH=learning python -m pathfinder_ml.scenarios --quick --queries 2 \
            --out bench/build/scenarios --demo bench/build/demo_world.pfmap
          ./bench/build/pf_bench --algos astar,dijkstra,dstar_lite --repeats 1 \
            --out bench/build/smoke.jsonl bench/build/scenarios/*.pfmap
          ! grep -q '"success":false' bench/build/smoke.jsonl

  cuda-build:
    # Compile-only check of the CUDA planners (no GPU on the runner).
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build pkg-config g++ liboctomap-dev
      - name: Build with CUDA
        run: |
          cmake -S bench -B bench/build -G Ninja
          cmake --build bench/build
          test -f bench/build/libpf_gpu.a
