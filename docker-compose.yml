services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: pathfinder-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    ports:
      - "9090:9090"  # Rerun web viewer
      - "9876:9876"  # Rerun gRPC (native viewer)
    network_mode: host
    cap_add:
      - SYS_PTRACE
